# Release testing: runs each suite in parallel (one runner per suite) and reports all of them
# into one QASE test-run created from the "<minor> Release Plan" under the given milestone.
# Re-trigger with the same milestone to re-run only the suites that still have missing/failed cases.
name: UI-RM_Release_QASE
run-name: ${{ format('Release `{0}` - `{1}` on `{2}` - suites `{3}` rerun={4}', inputs.milestone, inputs.rancher_version, inputs.upstream_cluster_version, inputs.suites, inputs.rerun) }}

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: QASE milestone of the release (e.g. v2.15.2), must already exist in project FLEET
        type: string
        required: true
      rancher_version:
        description: Rancher version channel/version/head_version latest/latest, latest/2.13.x[-rc1], prime/2.13.x, prime/devel/2.13, alpha/2.14.0-alpha1, prime-alpha/2.x.x-alphaX
        type: string
        required: true
      upstream_cluster_version:
        description: K3s upstream cluster version where to install Rancher
        default: 'v1.33.5+k3s1'
        type: string
        required: true
      suites:
        description: Suites to run in parallel, space separated (p0 p1 p1_2 rbac special_tests appco). @login is added to each
        default: 'p0 p1 p1_2 rbac special_tests'
        type: string
      rerun:
        description: "failed = suites with missing or failed plan cases, missing = suites with not-yet-run cases only, all = every listed suite"
        default: failed
        type: choice
        options:
          - failed
          - missing
          - all
      qase_run_id:
        description: Existing QASE run ID to use instead of resolving the release run (leave empty normally)
        type: string
        default: ''
      complete_run:
        description: Complete the QASE run once every plan case of the listed suites has passed
        default: true
        type: boolean
      runner_template:
        description: Runner template to use (spot or dedicated)
        default: fleet-e2e-ci-runner-spot-x86-64-template-v3
        type: choice
        options:
          - fleet-e2e-ci-runner-spot-x86-64-template-v3
          - fleet-e2e-ci-runner-spot-x86-64-template-v3-dedicated
      destroy_runner:
        description: Destroy the auto-generated self-hosted runner
        default: true
        type: boolean
      branch:
        description: 'Branch to run the workflow on (Update when using 2.10 or less)'
        required: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      qase_run_id: ${{ steps.resolve.outputs.qase_run_id }}
      suites: ${{ steps.suites.outputs.suites }}
    env:
      QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
      MILESTONE: ${{ inputs.milestone }}
      RANCHER_VERSION: ${{ inputs.rancher_version }}
      K3S_VERSION: ${{ inputs.upstream_cluster_version }}
      SUITES: ${{ inputs.suites }}
      RERUN: ${{ inputs.rerun }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - name: Resolve or create the QASE release run
        id: resolve
        env:
          QASE_RUN_ID: ${{ inputs.qase_run_id }}
        run: .github/scripts/qase-release-run.sh resolve
      - name: Select suites to run
        id: suites
        env:
          QASE_RUN_ID: ${{ steps.resolve.outputs.qase_run_id }}
        run: .github/scripts/qase-release-run.sh suites

  ui:
    needs: resolve
    if: ${{ needs.resolve.outputs.suites != '[]' }}
    strategy:
      # Siblings must not be cancelled: a cancelled e2e job completes the shared QASE run
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.resolve.outputs.suites) }}
    uses: ./.github/workflows/master-e2e.yaml
    secrets:
      credentials: ${{ secrets.GCP_CREDENTIALS }}
      pat_token: ${{ secrets.SELF_HOSTED_RUNNER_PAT_TOKEN }}
      rancher_password: ${{ secrets.RANCHER_PASSWORD }}
      gitlab_private_user: ${{ secrets.GITLAB_PRIVATE_USER }}
      gitlab_private_pwd: ${{ secrets.GITLAB_PRIVATE_PWD }}
      bitbucket_private_user: ${{ secrets.BITBUCKET_PRIVATE_USER }}
      bitbucket_private_pwd: ${{ secrets.BITBUCKET_PRIVATE_PWD }}
      gh_private_user: ${{ secrets.GH_PRIVATE_USER }}
      gh_private_pwd: ${{ secrets.GH_PRIVATE_PWD }}
      azure_private_user: ${{ secrets.AZURE_PRIVATE_USER }}
      azure_private_pwd: ${{ secrets.AZURE_PRIVATE_PWD }}
      rsa_private_key_qa: ${{ secrets.RSA_PRIVATE_KEY_QA }}
      rsa_public_key_qa: ${{ secrets.RSA_PUBLIC_KEY_QA }}
      qase_api_token: ${{ secrets.QASE_API_TOKEN }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      github_app_id: ${{ secrets.GH_APP_ID }}
      github_app_installation_id: ${{ secrets.GH_APP_INSTALLATION_ID }}
      github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      appco_username: ${{ secrets.APPCO_USERNAME }}
      appco_access_token: ${{ secrets.APPCO_ACCESS_TOKEN }}
    with:
      test_description: "CI/Manual - UI - Release test @${{ matrix.suite }} with Standard K3s"
      # Unique per suite: artifact names are derived from it
      cluster_name: cluster-k3s-${{ matrix.suite }}
      destroy_runner: ${{ inputs.destroy_runner }}
      upstream_cluster_version: ${{ inputs.upstream_cluster_version }}
      rancher_version: ${{ inputs.rancher_version }}
      qase_report: true
      qase_run_id: ${{ needs.resolve.outputs.qase_run_id }}
      qase_complete_run: false
      grep_test_by_tag: '@login @${{ matrix.suite }}'
      branch: ${{ inputs.branch }}
      runner_template: ${{ inputs.runner_template }}

  finalize:
    needs: [resolve, ui]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - name: Report suite status and complete the QASE run if everything passed
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          MILESTONE: ${{ inputs.milestone }}
          SUITES: ${{ inputs.suites }}
          QASE_RUN_ID: ${{ needs.resolve.outputs.qase_run_id }}
          COMPLETE_RUN: ${{ inputs.complete_run }}
        run: .github/scripts/qase-release-run.sh finalize
