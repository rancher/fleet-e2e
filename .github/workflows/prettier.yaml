name: Prettier Check

on:
  pull_request:
    branches: [ main ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'tests/**/*.ts'
      - 'tests/**/*.js'
      - 'tests/**/*.json'
      - 'tests/**/*.yml'
      - 'tests/**/*.yaml'
      - 'tests/**/*.md'
      - 'tests/package.json'
      - 'tests/.prettierrc.json'
      - 'tests/.prettierignore'
      - '.github/workflows/prettier.yaml'

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current

      - name: Install dependencies
        working-directory: tests
        run: npm install

      - name: Run ESLint
        working-directory: tests
        run: npm run lint

      - name: Run Prettier
        working-directory: tests
        run: npm run prettier
