# Plain HTTP Helm repository used to check the User-Agent Fleet sends (rancher/fleet#4085).
# nginx keeps its default access log (combined format, to stdout), which includes the User-Agent.
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-ua-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ua-helm-repo
  namespace: fleet-ua-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-ua-helm-repo
  template:
    metadata:
      labels:
        app: nginx-ua-helm-repo
    spec:
      containers:
        - name: nginx
          image: nginx
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: data
          configMap:
            name: helm-repo-data
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ua-service
  namespace: fleet-ua-test
spec:
  selector:
    app: nginx-ua-helm-repo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: helm-repo-data
  namespace: fleet-ua-test
data:
  index.yaml: |
    apiVersion: v1
    entries:
      app:
        - name: app
          version: 0.1.0
          urls:
            - app-0.1.0.tgz
binaryData:
  app-0.1.0.tgz: 
